<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Моя визитка</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: linear-gradient(to bottom right, #f8f9fa, #dbeafe);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 350px;
    }
    img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 20px;
    }
    h1 {
      margin: 10px 0;
    }
    p {
      color: #555;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      background: #3b82f6;
      color: white;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background: #2563eb;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="avatar.jpg" alt="Аватар">
    <h1>Твоё имя</h1>
    <p>Frontend-разработчик | HTML, CSS, JS</p>
    <a href="https://t.me/твой_никнейм" target="_blank">
        <button>Связаться в Telegram</button>
      </a>
      
  </div>
</body>
</html>
